[workspace]
members = ["crates/core"]

# Shared across the workspace so the macOS app and the future terminal frontend
# can never drift apart on a core dependency.
[workspace.dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smol = "2.0.2"

[package]
name = "orri"
version = "0.1.0"
edition = "2024"

[dependencies]
orri-core = { path = "crates/core" }
anyhow = { workspace = true }
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
gpui-component = "0.5.1"
